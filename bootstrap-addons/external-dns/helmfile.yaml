repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami

releases:
  - name: external-dns
    namespace: kube-system
    chart: bitnami/external-dns
    version: 9.0.0
    values:
      - sources:
          - service
          - ingress
          - pod
        image:
          registry: registry.k8s.io
          repository: external-dns/external-dns
          tag: v0.18.0
        global:
          security:
            allowInsecureImages: true
