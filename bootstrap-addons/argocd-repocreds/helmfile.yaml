repositories:
  - name: kubernetes-incubator
    url: https://charts.helm.sh/incubator

releases:
  - name: repository-creds-addons
    namespace: argocd
    chart: "kubernetes-incubator/raw"
    version: "0.2.3"
    wait: true
    timeout: 120
    cleanupOnFail: true
    values:
      - resources:
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              annotations:
                sealedsecrets.bitnami.com/cluster-wide: "true"
              name: repository-creds.addons
              namespace: argocd
            spec:
              encryptedData:
                password: 
                type: 
                url: 
                username: 
              template:
                data: null
                metadata:
                  annotations:
                    sealedsecrets.bitnami.com/cluster-wide: "true"
                  labels:
                    argocd.argoproj.io/secret-type: repository
                  name: repository-creds.addons
                  namespace: argocd
                type: Opaque
  - name: repository-creds-ecr
    namespace: argocd
    chart: "kubernetes-incubator/raw"
    version: "0.2.3"
    wait: true
    timeout: 120
    cleanupOnFail: true
    values:
      - resources:
          - apiVersion: bitnami.com/v1alpha1
            kind: SealedSecret
            metadata:
              annotations:
                sealedsecrets.bitnami.com/cluster-wide: "true"
              name: repository-creds.ecr
              namespace: argocd
            spec:
              encryptedData:
                password: 
                type: 
                url: 
                username: 
              template:
                data: null
                metadata:
                  annotations:
                    sealedsecrets.bitnami.com/cluster-wide: "true"
                  labels:
                    argocd.argoproj.io/secret-type: repository
                  name: repository-creds.ecr
                  namespace: argocd
                type: Opaque
