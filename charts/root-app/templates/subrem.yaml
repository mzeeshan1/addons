apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: subrem
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dev
  source:
    repoURL: https://github.com/mzeeshan1/subscription-reminder.git
    path: deploy/
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      selfHeal: true
