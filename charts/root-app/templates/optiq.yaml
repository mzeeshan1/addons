apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: optiq
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dev
  source:
    repoURL: https://github.com/mzeeshan1/optiq.git
    path: deploy/
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: optiq
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
